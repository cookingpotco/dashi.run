name: CI

# Format, lint, and type-check. A violation of any of those goes red.
on:
  push:
    branches: [main]
  pull_request:

# PRs replace an in-flight run. A second push to main does not cancel.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Shared with setup-deno so the cache path matches what Deno actually uses.
  DENO_DIR: ${{ github.workspace }}/.deno

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .tool-versions

      - uses: actions/cache@v5
        with:
          path: ${{ env.DENO_DIR }}
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Install locked dependencies
        run: deno ci

      - name: Build CSS
        run: deno task css

      - name: Format
        run: deno fmt --check .

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check main.ts css.ts
